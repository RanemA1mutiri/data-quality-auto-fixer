[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#FBFBFD"
secondaryBackgroundColor = "#F1F3F5"
textColor = "#1A1D24"
font = "sans serif"

[server]
# The demo runs on shared free hosting (~1GB RAM); the old 200MB default
# advertised a size the container cannot actually process.
maxUploadSize = 25
