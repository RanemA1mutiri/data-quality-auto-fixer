name: Keep app awake

# Streamlit Community Cloud puts free apps to sleep after a period with no
# real visitors. A plain HTTP ping (UptimeRobot and friends) is NOT enough:
# the app only counts a visit when a browser opens a WebSocket session.
# So we drive a real headless Chromium against the live URL on a schedule.

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub cron is best-effort)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

# This job only opens a public URL — it needs no access to the repo at all.
permissions: {}

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Open the app in a real browser
        run: |
          python - <<'PY'
          import re, sys, time
          from playwright.sync_api import sync_playwright

          URL = "https://data-quality-auto-fixer.streamlit.app"
          HEADING = "Data Quality Auto-Fixer"   # only present once the app renders
          WAKE = re.compile("get this app back up", re.I)

          def app_frame(page):
              """Streamlit Cloud serves the app from a nested frame, not the top
              document, so anything checking the top frame always sees an empty
              page and reports a false failure."""
              for f in page.frames:
                  if "/~/+/" in f.url:
                      return f
              return None

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(URL, wait_until="domcontentloaded", timeout=120_000)

              # A sleeping app shows a wake button; a cold one just takes a while.
              try:
                  page.get_by_role("button", name=WAKE).click(timeout=8_000)
                  print("App was asleep - clicked the wake button")
              except Exception:
                  print("No wake button (app was already up, or still booting)")

              # Waking from cold can take minutes, so poll for the app's own
              # heading inside its frame instead of sleeping a fixed amount.
              deadline, ready = time.time() + 240, False
              while time.time() < deadline:
                  frame = app_frame(page)
                  if frame:
                      try:
                          frame.wait_for_selector(f"text={HEADING}", timeout=5_000)
                          ready = True
                          break
                      except Exception:
                          pass
                  page.wait_for_timeout(2_000)

              if not ready:
                  print("App did NOT render within 4 minutes")
                  print("frames seen:", [f.url for f in page.frames])
                  browser.close()
                  sys.exit(1)

              print("App rendered - the session is live")
              # Hold the session open briefly so it is unambiguously a real visit.
              page.wait_for_timeout(15_000)
              browser.close()
          PY
