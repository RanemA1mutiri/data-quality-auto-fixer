name: Keep app awake

# Streamlit Community Cloud puts free apps to sleep after a period with no
# real visitors. A plain HTTP ping (UptimeRobot and friends) is NOT enough:
# the app only counts a visit when a browser opens a WebSocket session.
# So we drive a real headless Chromium against the live URL on a schedule.

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub cron is best-effort)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Open the app in a real browser
        run: |
          python - <<'PY'
          import re, sys
          from playwright.sync_api import sync_playwright

          URL = "https://data-quality-auto-fixer.streamlit.app"
          # A heading that only exists once the Streamlit app itself has rendered.
          READY = "text=Data Quality Auto-Fixer"
          WAKE = re.compile("get this app back up", re.I)

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(URL, wait_until="domcontentloaded", timeout=120_000)

              # A sleeping app shows a wake button; a cold one just takes a while.
              try:
                  page.get_by_role("button", name=WAKE).click(timeout=8_000)
                  print("App was asleep - clicked the wake button")
              except Exception:
                  print("No wake button (app was already up, or still booting)")

              # Waking from cold can take a couple of minutes, so wait for the
              # app's own content rather than a fixed sleep.
              try:
                  page.wait_for_selector(READY, timeout=180_000)
                  print("App rendered - the session is live")
              except Exception:
                  print("App did NOT render within 3 minutes")
                  print("page title:", page.title())
                  print("body head:", page.inner_text("body")[:300].strip() or "(empty)")
                  browser.close()
                  sys.exit(1)

              # Hold the session open briefly so it is unambiguously a real visit.
              page.wait_for_timeout(15_000)
              browser.close()
          PY
